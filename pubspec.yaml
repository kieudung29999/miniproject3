name: receipt_tracker
description: Receipt & Expense Tracker - offline-first, Gemini AI khi có mạng.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  intl: '>=0.19.0 <1.0.0'
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
